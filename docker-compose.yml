x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

services:
  # -------------------------------------------------------------
  # Infrastructure Data Stores & Broker
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: logistics_mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: logistics_orders
      MYSQL_USER: ${MYSQL_USER:-order_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: logistics_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: logistics_shipments
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d logistics_shipments || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  mongodb:
    image: mongo:7.0
    container_name: logistics_mongodb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: logistics_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    ports:
      - "127.0.0.1:5672:5672"     # AMQP Broker
      - "127.0.0.1:15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_running || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  # -------------------------------------------------------------
  # Microservices
  # -------------------------------------------------------------
  # MS1: Order Service (Node.js, Express, TS, MySQL)
  order-service:
    <<: *service-security
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: logistics_order_service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: /api/v1
      LOG_LEVEL: info
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: logistics_orders
      DB_USER: order_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_CONNECTION_LIMIT: 10
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:3001,http://${PUBLIC_HOST:-localhost}:3000
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      RABBITMQ_ORDER_EXCHANGE: logistics.events
      OUTBOX_POLL_INTERVAL_MS: 3000
    networks:
      - edge
      - backend

  # MS2: Shipment Service (Node.js, Express, TS, PostgreSQL)
  shipment-service:
    <<: *service-security
    build:
      context: ./services/shipment-service
      dockerfile: Dockerfile
    container_name: logistics_shipment_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      API_PREFIX: /api/v1
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logistics_shipments
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POOL_MAX: 10
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:3002,http://${PUBLIC_HOST:-localhost}:3000
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      RABBITMQ_EXCHANGE: logistics.events
      OUTBOX_POLL_INTERVAL_MS: 3000
    networks:
      - edge
      - backend

  # MS3: Tracking Service (Python, FastAPI, MongoDB)
  tracking-service:
    <<: *service-security
    build:
      context: ./services/tracking-service
      dockerfile: Dockerfile
    container_name: logistics_tracking_service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      PORT: 3003
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: logistics_tracking
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: logistics.events
    networks:
      - edge
      - backend

  # MS4: ETA & Risk Prediction Service (C++17, CMake)
  prediction-service:
    <<: *service-security
    build:
      context: ./services/prediction-service
      dockerfile: Dockerfile
    container_name: logistics_prediction_service
    restart: unless-stopped
    depends_on:
      - shipment-service
      - tracking-service
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      PORT: 3004
      SHIPMENT_SERVICE_HOST: shipment-service
      SHIPMENT_SERVICE_PORT: 3002
      TRACKING_SERVICE_HOST: tracking-service
      TRACKING_SERVICE_PORT: 3003
    networks:
      - edge
      - backend

  # Frontend: Control Tower Dashboard (React, Vite, Nginx)
  frontend:
    <<: *service-security
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logistics_control_tower_ui
    restart: unless-stopped
    depends_on:
      - order-service
      - shipment-service
      - tracking-service
      - prediction-service
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:8080"
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0755
      - /var/log/nginx:rw,noexec,nosuid,size=4m
    networks:
      - edge

# -------------------------------------------------------------
# Persistent Volumes
# -------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  rabbitmq_data:
    driver: local

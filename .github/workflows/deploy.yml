name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment inputs
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          test -n "$AWS_REGION" || { echo "::error::AWS_REGION is missing from repository Actions secrets."; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "::error::AWS_ROLE_ARN is missing from repository Actions secrets."; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo "::error::EC2_INSTANCE_ID is missing from repository Actions secrets."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy through Systems Manager
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg sha "$DEPLOY_SHA" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Comment: ("Deploy logistics-control-tower " + $sha),
              Parameters: {
                commands: [
                  "set -Eeuo pipefail",
                  "cd /opt/logistics-control-tower",
                  "git fetch --prune origin",
                  ("git reset --hard " + $sha),
                  "TOKEN=$(curl -fsS -X PUT -H \"X-aws-ec2-metadata-token-ttl-seconds: 60\" http://169.254.169.254/latest/api/token)",
                  "PUBLIC_HOST=$(curl -fsS -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/public-ipv4)",
                  "sudo env PUBLIC_HOST=\"$PUBLIC_HOST\" COMPOSE_PARALLEL_LIMIT=1 docker compose config --quiet",
                  "sudo env PUBLIC_HOST=\"$PUBLIC_HOST\" COMPOSE_PARALLEL_LIMIT=1 docker compose build",
                  "sudo env PUBLIC_HOST=\"$PUBLIC_HOST\" docker compose up -d --remove-orphans",
                  "sudo env PUBLIC_HOST=\"$PUBLIC_HOST\" docker compose ps"
                ]
              }
            }' > ssm-command.json

          COMMAND_ID="$(aws ssm send-command \
            --cli-input-json file://ssm-command.json \
            --query 'Command.CommandId' \
            --output text)"
          rm -f ssm-command.json

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)"
          test "$STATUS" = "Success" || {
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
            exit 1
          }

      - name: Verify deployment
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          EC2_HOST="$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)"
          curl --fail --silent --show-error --max-time 30 "http://$EC2_HOST:3000/"

name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          test -n "$EC2_HOST" || { echo "::error::EC2_HOST is missing from repository Actions secrets."; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::EC2_SSH_KEY is missing from repository Actions secrets."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: /opt/logistics-control-tower
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          git fetch --prune origin
          git reset --hard "${{ github.event.workflow_run.head_sha || 'origin/main' }}"
          export PUBLIC_HOST="$(curl -fsS http://169.254.169.254/latest/meta-data/public-ipv4)"
          sudo env PUBLIC_HOST="$PUBLIC_HOST" COMPOSE_PARALLEL_LIMIT=1 docker compose config --quiet
          sudo env PUBLIC_HOST="$PUBLIC_HOST" COMPOSE_PARALLEL_LIMIT=1 docker compose build
          sudo env PUBLIC_HOST="$PUBLIC_HOST" docker compose up -d --remove-orphans
          sudo env PUBLIC_HOST="$PUBLIC_HOST" docker compose ps
          REMOTE_SCRIPT

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --silent --show-error --max-time 30 "http://$EC2_HOST:3000/"

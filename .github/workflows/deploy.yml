name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment inputs
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          test -n "$AWS_REGION" || { echo "::error::AWS_REGION is missing from repository Actions secrets."; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "::error::AWS_ROLE_ARN is missing from repository Actions secrets."; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo "::error::EC2_INSTANCE_ID is missing from repository Actions secrets."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy through Systems Manager
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg sha "$DEPLOY_SHA" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Comment: ("Deploy logistics-control-tower " + $sha),
              Parameters: {
                commands: [
                  "set -eu",
                  "cd /opt/logistics-control-tower",
                  "git fetch --prune origin",
                  ("git reset --hard " + $sha),
                  "TOKEN=$(curl -fsS -X PUT -H \"X-aws-ec2-metadata-token-ttl-seconds: 60\" http://169.254.169.254/latest/api/token)",
                  "PUBLIC_HOST=$(curl -fsS -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/public-ipv4)",
                  "if ! command -v openssl >/dev/null 2>&1; then apt-get update; apt-get install -y openssl; fi",
                  "sh scripts/initialize-env.sh",
                  "chmod 600 .env",
                  "sudo env PUBLIC_HOST=\"$PUBLIC_HOST\" BIND_ADDRESS=0.0.0.0 COMPOSE_PARALLEL_LIMIT=1 docker compose config --quiet",
                  "sudo env PUBLIC_HOST=\"$PUBLIC_HOST\" BIND_ADDRESS=0.0.0.0 COMPOSE_PARALLEL_LIMIT=1 docker compose build",
                  "sudo env PUBLIC_HOST=\"$PUBLIC_HOST\" BIND_ADDRESS=0.0.0.0 docker compose up -d --remove-orphans",
                  "sudo env PUBLIC_HOST=\"$PUBLIC_HOST\" BIND_ADDRESS=0.0.0.0 docker compose ps",
                  "attempt=0; until curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; do attempt=$((attempt + 1)); if [ \"$attempt\" -ge 60 ]; then sudo env BIND_ADDRESS=0.0.0.0 docker compose ps; exit 1; fi; sleep 5; done"
                ]
              }
            }' > ssm-command.json

          COMMAND_ID="$(aws ssm send-command \
            --cli-input-json file://ssm-command.json \
            --query 'Command.CommandId' \
            --output text)"
          rm -f ssm-command.json

          STATUS="Pending"
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || printf 'Pending')"
            case "$STATUS" in
              Success)
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                echo "::warning::Unexpected SSM status '$STATUS'; continuing to poll."
                sleep 10
                ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deployment did not complete within 15 minutes (last status: $STATUS)."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID"
            exit 1
          fi

      - name: Verify deployment
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          EC2_HOST="$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "http://$EC2_HOST:3000/" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deployment is not reachable at http://$EC2_HOST:3000/ after 60 seconds."
          exit 1

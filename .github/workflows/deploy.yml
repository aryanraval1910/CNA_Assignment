name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: /opt/logistics-control-tower
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          git fetch --prune origin
          git reset --hard "origin/main"
          export PUBLIC_HOST="$(curl -fsS http://169.254.169.254/latest/meta-data/public-ipv4)"
          sudo env PUBLIC_HOST="$PUBLIC_HOST" COMPOSE_PARALLEL_LIMIT=1 docker compose config --quiet
          sudo env PUBLIC_HOST="$PUBLIC_HOST" COMPOSE_PARALLEL_LIMIT=1 docker compose build
          sudo env PUBLIC_HOST="$PUBLIC_HOST" docker compose up -d --remove-orphans
          sudo env PUBLIC_HOST="$PUBLIC_HOST" docker compose ps
          REMOTE_SCRIPT

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --silent --show-error --max-time 30 "http://$EC2_HOST:3000/"
